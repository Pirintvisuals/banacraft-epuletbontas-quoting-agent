<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Banacraft - Bontás árbecslő</title>
  <link rel="icon" href="logo.png" type="image/png" />
  <style>
    :root { --dark: #2B2822; --accent: #D65E24; --ground: #F6F3EE; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--ground); color: var(--dark); }
    .demo { max-width: 680px; margin: 0 auto; padding: 72px 24px; text-align: center; }
    .demo img { width: 220px; height: auto; }
    .demo h1 { font-size: 30px; margin: 22px 0 10px; }
    .demo p { color: #5c574d; line-height: 1.6; }
    .demo button { margin-top: 18px; padding: 14px 26px; border: none; border-radius: 999px; background: var(--accent); color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <main class="demo">
    <img src="logo.png" alt="Banacraft" />
    <h1>Belső bontás és épületbontás - árbecslő</h1>
    <p>Az asszisztens a jobb alsó sarokban lévő gombbal indítható, vagy az alábbi gombbal - ugyanúgy, ahogy a weboldal saját „Árbecslés indítása” gombjai nyitják majd.</p>
    <button type="button" data-quote-agent>Árbecslés indítása</button>
  </main>
  <script src="widget.js"></script>
</body>
</html>
